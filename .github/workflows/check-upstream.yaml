name: Check Upstream Releases

on:
  schedule:
    # Check daily - upstream releases are infrequent
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check-releases:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: nginx
            repo: nginx/nginx
          - name: valkey
            repo: valkey-io/valkey

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Get latest upstream release
        id: upstream
        run: |
          LATEST=$(gh api repos/${{ matrix.repo }}/releases/latest --jq '.tag_name' 2>/dev/null || echo "")
          if [ -z "$LATEST" ]; then
            LATEST=$(gh api repos/${{ matrix.repo }}/tags --jq '.[0].name')
          fi
          echo "version=${LATEST}" >> "$GITHUB_OUTPUT"
          echo "Latest ${{ matrix.name }}: ${LATEST}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if version is tracked
        id: check
        run: |
          TRACKED=""
          if [ -f "images/${{ matrix.name }}/.upstream-version" ]; then
            TRACKED=$(cat "images/${{ matrix.name }}/.upstream-version")
          fi
          if [ "$TRACKED" != "${{ steps.upstream.outputs.version }}" ]; then
            echo "new_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "new_release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Update tracked version
        if: steps.check.outputs.new_release == 'true'
        run: |
          echo "${{ steps.upstream.outputs.version }}" > "images/${{ matrix.name }}/.upstream-version"

      - name: Create PR for new release
        if: steps.check.outputs.new_release == 'true'
        run: |
          BRANCH="upstream/${{ matrix.name }}-${{ steps.upstream.outputs.version }}"
          git config user.name "distil-bot"
          git config user.email "distil-bot@users.noreply.github.com"
          git checkout -b "${BRANCH}"
          git add "images/${{ matrix.name }}/.upstream-version"
          git commit -m "chore(${{ matrix.name }}): track upstream ${{ steps.upstream.outputs.version }}"
          git push origin "${BRANCH}"
          gh pr create \
            --title "chore(${{ matrix.name }}): upstream ${{ steps.upstream.outputs.version }}" \
            --body "New upstream release detected: **${{ steps.upstream.outputs.version }}**

          This PR triggers a rebuild of the ${{ matrix.name }} image against the latest Wolfi packages.

          Auto-generated by distil upstream checker." \
            --base main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
