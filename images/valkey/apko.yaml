contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
  packages:
    - wolfi-baselayout
    - valkey
    - valkey-cli

entrypoint:
  command: /usr/bin/valkey-server

accounts:
  groups:
    - groupname: valkey
      gid: 65532
  users:
    - username: valkey
      uid: 65532
  run-as: valkey

paths:
  - path: /data
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755

work-dir: /data

archs:
  - x86_64
  - aarch64
