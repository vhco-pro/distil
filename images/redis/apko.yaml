contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
  packages:
    - wolfi-baselayout
    - redis
    - redis-cli

entrypoint:
  command: /usr/bin/redis-server

accounts:
  groups:
    - groupname: redis
      gid: 65532
  users:
    - username: redis
      uid: 65532
  run-as: redis

paths:
  - path: /data
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755

work-dir: /data

archs:
  - x86_64
  - aarch64
